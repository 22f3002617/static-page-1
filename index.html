<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Picker and Total Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #currency-picker, #total-currency {
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Product Sales Tracker</h1>

    <label for="currency-picker">Select Currency:</label>
    <select id="currency-picker">
        <!-- Options will be added dynamically -->
    </select>
    
    <table id="product-sales">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price (USD)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>150</td>
            </tr>
        </tbody>
    </table>

    <div id="total">
        <strong>Total: </strong>
        <span id="total-amount">300</span>
        <span id="total-currency">USD</span>
    </div>
    
    <div id="markdown-output">
        <!-- Placeholder for markdown content -->
    </div>

    <script>
        (function() {
            const rates = {
                "USD": 1,
                "EUR": 0.92,
                "INR": 83.15,
                "JPY": 148.3,
                "GBA": 0.78
            };

            const currencyPicker = document.getElementById('currency-picker');
            const totalAmount = document.getElementById('total-amount');
            const totalCurrency = document.getElementById('total-currency');
            const productRows = document.querySelectorAll("#product-sales tbody tr td:last-child");
            
            // Populate currency options
            for (const [currency, rate] of Object.entries(rates)) {
                const option = document.createElement('option');
                option.value = currency;
                option.textContent = currency;
                currencyPicker.appendChild(option);
            }

            const convertTotal = (targetCurrency) => {
                const sum = Array.from(productRows).reduce((acc, cell) => acc + parseFloat(cell.textContent), 0);
                const convertedValue = (sum * rates[targetCurrency] / rates["USD"]).toFixed(2);
                totalAmount.textContent = convertedValue;
                totalCurrency.textContent = targetCurrency;
            };

            currencyPicker.addEventListener('change', (event) => {
                convertTotal(event.target.value);
            });

            // Initialize total in default currency
            convertTotal('USD');
            
            // Mockup markdown content
            document.getElementById('markdown-output').innerHTML = "<h2>Sample Markdown Content</h2>";
        })();
    </script>    
</body>
</html>
