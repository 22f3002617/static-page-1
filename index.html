<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Picker and Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        select {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Currency Picker and Converter</h1>

    <select id="currency-picker">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="INR">INR</option>
        <option value="JPY">JPY</option>
        <option value="GBA">GBA</option>
    </select>

    <table id="product-sales">
        <thead>
            <tr>
                <th>Product</th>
                <th>Sales (in USD)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>150</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>

    <div>Total Sales: <span id="total-sales">450</span> <span id="total-currency">USD</span></div>

    <div id="markdown-output"><h2>Conversion Example</h2></div>

    <script>
        (function() {
            const rates = {
                "USD": 1,
                "EUR": 0.92,
                "INR": 83.15,
                "JPY": 148.3,
                "GBA": 0.78
            };

            const currencyPicker = document.getElementById('currency-picker');
            const totalSalesElement = document.getElementById('total-sales');
            const totalCurrencyElement = document.getElementById('total-currency');
            const rows = [...document.querySelectorAll("#product-sales tbody tr td:last-child")];
            const usdSum = rows.reduce((acc, cell) => acc + parseFloat(cell.textContent), 0);
            totalSalesElement.textContent = usdSum.toFixed(2);

            currencyPicker.addEventListener('change', (event) => {
                const selectedCurrency = event.target.value;
                const rate = rates[selectedCurrency];
                const convertedTotal = usdSum * rate;
                totalSalesElement.textContent = convertedTotal.toFixed(2);
                totalCurrencyElement.textContent = selectedCurrency;
            });
        })();
    </script>
</body>
</html>
