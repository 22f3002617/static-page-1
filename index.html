<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Picker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border: 1px solid #ddd; }
        #currency-picker { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Product Sales</h1>
    <select id="currency-picker">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="INR">INR</option>
        <option value="JPY">JPY</option>
        <option value="GBA">GBA</option>
    </select>

    <table id="product-sales">
        <thead>
            <tr>
                <th>Product</th>
                <th>Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>300</td>
            </tr>
        </tbody>
    </table>

    <p>Total: <span id="total-currency">USD</span> <span id="total-value"></span></p>
    <div id="markdown-output"></div>

    <script>
        (function() {
            const rates = {
                "USD": 1,
                "EUR": 0.92,
                "INR": 83.15,
                "JPY": 148.3,
                "GBA": 0.78
            };

            const currencyPicker = document.getElementById('currency-picker');
            const totalCurrency = document.getElementById('total-currency');
            const totalValue = document.getElementById('total-value');
            const rows = [...document.querySelectorAll("#product-sales tbody tr td:last-child")];

            function calculateTotal() {
                const sum = rows.reduce((acc, cell) => acc + parseFloat(cell.textContent), 0);
                const selectedCurrency = currencyPicker.value;
                const convertedSum = sum * rates[selectedCurrency];
                totalCurrency.textContent = selectedCurrency;
                totalValue.textContent = convertedSum.toFixed(2);
            }

            currencyPicker.addEventListener('change', calculateTotal);
            
            window.onload = calculateTotal;

            // Markdown output
            const markdownOutput = document.getElementById('markdown-output');
            markdownOutput.innerHTML = `
                <h2>Markdown Example</h2>
                <p>This is a demonstration of how markdown is rendered.</p>
            `;
        })();
    </script>
</body>
</html>
